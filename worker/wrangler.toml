name = "simona-contact"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public vars (no secrets). SITE_ORIGIN = the GitHub Pages / custom domain
# origin that is allowed to call the API.
[vars]
SITE_ORIGIN = "https://www.simonalascialfari.com"
CONTACT_FROM = "Simona Lascialfari <noreply@simonalascialfari.com>"
CONTACT_TO = "simona.lascialfari.305@gmail.com"

# Rate limiting: 10 requests per 10 minutes per IP
# (namespace_id is an arbitrary ID required by the API, used for metrics)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
[unsafe.bindings.options]
interval = 600
simple_limit = 10
