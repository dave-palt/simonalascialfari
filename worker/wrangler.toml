name = "simona-contact"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public vars (no secrets). SITE_ORIGIN = the GitHub Pages / custom domain
# origin that is allowed to call the API.
# NOTE: CONTACT_FROM needs simonalascialfari.com verified on Resend
# (SPF/DKIM). Until then, Resend rejects sends with 403 (unverified domain).
[vars]
SITE_ORIGIN = "https://www.simonalascialfari.com"
CONTACT_FROM = "Simona Lascialfari <noreply@simonalascialfari.com>"
CONTACT_TO = "simona.lascialfari.305@gmail.com"

# Rate limiting: 10 requests per minute per IP.
# NOTE: the API only supports period = 10 | 60 seconds, so the original
# "10 req / 10 min" intent is approximated with 10 req / 60 s.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
