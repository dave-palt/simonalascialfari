name = "simona-contact"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public vars (no secrets). SITE_ORIGIN = the GitHub Pages / custom domain
# origin that is allowed to call the API.
[vars]
SITE_ORIGIN = "https://www.simonalascialfari.com"
# TEMP: resend requires a verified domain for custom senders; until
# simonalascialfari.com is verified on Resend (SPF/DKIM), use the test sender
# (deliverable only to the Resend account owner's email).
CONTACT_FROM = "Simona Lascialfari <onboarding@resend.dev>"
CONTACT_TO = "gh@dav3.cc"

# Rate limiting: 10 requests per minute per IP.
# NOTE: the API only supports period = 10 | 60 seconds, so the original
# "10 req / 10 min" intent is approximated with 10 req / 60 s.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
