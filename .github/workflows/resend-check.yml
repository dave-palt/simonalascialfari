name: Resend domain status

# Diagnostic: prints Resend domain verification status + expected DNS records
# (public DNS data only — never prints the API key). workflow_dispatch only.
on:
  workflow_dispatch:
    inputs:
      verify_id:
        description: "Optional: domain id to re-trigger verification for"
        required: false
        default: ""

permissions: {}

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query Resend domains
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERIFY_ID: ${{ inputs.verify_id }}
        run: |
          if [ -n "$VERIFY_ID" ]; then
            echo "== re-verify $VERIFY_ID =="
            curl -s -X POST "https://api.resend.com/domains/$VERIFY_ID/verify" -H "Authorization: Bearer $RESEND_API_KEY" | head -c 2000
            echo
          fi
          echo "== test send 1: sandbox sender -> gh@dav3.cc =="
          curl -s "https://api.resend.com/emails" -X POST \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
            -d '{"from":"Diagnostic <onboarding@resend.dev>","to":["gh@dav3.cc"],"subject":"Resend diag 1: sandbox sender","text":"Se ricevi questa, la chiave invia OK (dominio non verificato e\' la causa)."}' \
            -o /tmp/s1.json -w "HTTP %{http_code}\n"; head -c 500 /tmp/s1.json; echo
          echo "== test send 2: prod sender -> gh@dav3.cc =="
          curl -s "https://api.resend.com/emails" -X POST \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
            -d '{"from":"Simona Lascialfari <noreply@simonalascialfari.com>","to":["gh@dav3.cc"],"subject":"Resend diag 2: prod sender","text":"Se ricevi questa, il dominio e\' verificato e il form funziona."}' \
            -o /tmp/s2.json -w "HTTP %{http_code}\n"; head -c 500 /tmp/s2.json; echo
          python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open('/tmp/domains.json'))
          except Exception as e:
              print('parse error:', e)
              raise SystemExit
          for dom in d.get('data', []):
              print('id:', dom.get('id'), '| name:', dom.get('name'), '| status:', dom.get('status'), '| region:', dom.get('region'))
              for r in dom.get('records', []):
                  print('   ', r.get('record'), r.get('name'), '->', (r.get('value') or '')[:80], '| status:', r.get('status'))
          PYEOF
