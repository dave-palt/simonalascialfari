name: CF token scope probe

# Diagnostic: checks which zone-level operations the CF_API_TOKEN secret can
# perform. Prints ONLY success/fail booleans — never the token or values.
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe scopes
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          Z=530fd6747a9b2c4f37c1149316f6311b
          p() {
            printf '%-46s ' "$1"
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_API_TOKEN" "$2")
            ok=$(python3 -c "import json;print(json.load(open('/tmp/r.json')).get('success'))" 2>/dev/null)
            echo "http=$code success=$ok"
          }
          echo "zone: simonalascialfari.com"
          p "zone read"              "https://api.cloudflare.com/client/v4/zones/$Z"
          p "dns read"               "https://api.cloudflare.com/client/v4/zones/$Z/dns_records?per_page=1"
          p "zone settings (ssl)"    "https://api.cloudflare.com/client/v4/zones/$Z/settings/ssl"
          p "rulesets phase (xform)" "https://api.cloudflare.com/client/v4/zones/$Z/rulesets/phases/http_response_headers_transform/entrypoint"
          p "account list"           "https://api.cloudflare.com/client/v4/accounts"
