name: Deploy GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build (vite + prerender)
        run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_BASE: "/${{ github.event.repository.name }}/"

      - name: Assemble content (D19)
        run: |
          if git ls-remote --exit-code --heads origin content >/dev/null 2>&1; then
            git fetch origin content
            # i contenuti del publisher vivono nel branch content — uno per
            # volta: git checkout fallisce TUTTO se un path manca
            for item in g p galleries.json homepage.json 404.html .nojekyll; do
              git --work-tree=. checkout origin/content -- "$item" 2>/dev/null || true
            done
            # copia i contenuti DENTRO dist (se esistono), sovrascrivendo
            if [ -d g ]; then cp -a g/. dist/; fi
            if [ -d p ]; then cp -a p/. dist/p/; fi
            for f in galleries.json homepage.json 404.html .nojekyll; do
              if [ -f "$f" ]; then cp "$f" dist/; fi
            done
            echo "contenuti inclusi da branch content"
          else
            echo "branch content assente — deploy solo codice"
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
