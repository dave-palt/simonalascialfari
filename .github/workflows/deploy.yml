name: Deploy GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build (vite + prerender)
        run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          # Demo su project page: base /<repo>/. Allo swap del dominio custom
          # (simonalascialfari.com): `gh variable set VITE_BASE --body /` — la
          # variabile repo HA precedenza sul default derivato dal nome repo.
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          # Token Search Console del dominio corrente (nuova verifica allo swap).
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION || '2x3LH3iVJFzE-hY_Y30aD7fmQPmM3oud4Bd67-7dB_U' }}

      - name: Assemble content (D19)
        run: |
          if git ls-remote --exit-code --heads origin content >/dev/null 2>&1; then
            git fetch origin content
            # N.B. fetch di un solo branch → il ref è FETCH_HEAD, NON
            # origin/content (ref remoto mai creato): usare FETCH_HEAD.
            # Un item per volta: git checkout fallisce TUTTO se un path manca.
            for item in g p galleries.json homepage.json 404.html .nojekyll robots.txt sitemap.xml llms.txt; do
              if git --work-tree=. checkout FETCH_HEAD -- "$item" 2>/dev/null; then
                echo "incluso da content: $item"
              else
                echo "warn: $item assente su content"
              fi
            done
            # copia i contenuti DENTRO dist (se esistono), sovrascrivendo —
            # g resta UNA DIRECTORY (g/<slug>/…): cp -a g/. dist/ lo appiattiva
            # e romperebbe i link /g/<slug>/ del sito e g/assets della shell
            if [ -d g ]; then cp -a g dist/; fi
            if [ -d p ]; then cp -a p dist/; fi
            for f in galleries.json homepage.json 404.html .nojekyll robots.txt sitemap.xml llms.txt; do
              if [ -f "$f" ]; then cp "$f" dist/; fi
            done
            echo "contenuti inclusi da branch content"
          else
            echo "branch content assente — deploy solo codice"
          fi

      # Custom domain: peaceiris rifà il branch force_orphan a ogni deploy,
      # quindi il CNAME va rigenerato DENTRO dist a ogni build. Allo swap:
      #   gh variable set CNAME_DOMAIN --body simonalascialfari.com
      # (variabile vuota/assente = nessun CNAME, project page demo invariata.)
      - name: Custom domain CNAME (se configurato)
        if: vars.CNAME_DOMAIN != ''
        run: echo "${{ vars.CNAME_DOMAIN }}" > ./dist/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
