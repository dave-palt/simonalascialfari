name: CI (PR)

# Controlli pre-merge: typecheck, sintassi JS admin, build completa con le
# stesse env del deploy + verifica che il prerender non renderizzi le pagine
# come 404 (pitfall noto: ssrLocation senza BASE_PREFIX → tutte le pagine
# escono come 404, v. AGENTS.md «Prerender (SEO)»).
# Il deploy resta su deploy.yml (push su main): qui niente permessi extra.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # L'admin è JS puro, fuori dal typecheck: unico controllo di sintassi.
      - name: Sintassi JS admin (node --check)
        run: |
          for f in public/admin/*.js; do
            node --check "$f" || { echo "::error::$f non passa node --check"; exit 1; }
          done

      # Stesse env del build di deploy.yml: così la CI vede le stesse rotture
      # che vedrebbe il deploy (base path, meta verifica, endpoint contatti).
      - name: Build (vite + prerender)
        run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION || '2x3LH3iVJFzE-hY_Y30aD7fmQPmM3oud4Bd67-7dB_U' }}

      # Pitfall prerender: se il base path non arriva allo script, ogni route
      # renderizza la 404 pur con titolo corretto nello shell → si verifica
      # un marker DI CORPO per pagina, non la dimensione (il CSS inlined
      # porta tutte le pagine sopra i 40 KB comunque).
      - name: Verifica prerender (nessuna pagina resa come 404)
        run: |
          set -e
          grep -q 'id="main-content"' dist/index.html \
            || { echo "::error::index.html non contiene la home (render 404?)"; exit 1; }
          grep -q 'PRIVACY POLICY' dist/privacy-policy.html \
            || { echo "::error::privacy-policy.html senza corpo privacy (render 404?)"; exit 1; }
          grep -q 'COOKIE POLICY' dist/cookie-policy.html \
            || { echo "::error::cookie-policy.html senza corpo cookie (render 404?)"; exit 1; }
          grep -q 'Pagina non trovata' dist/404.html \
            || { echo "::error::404.html senza corpo 404"; exit 1; }
          echo "prerender OK: tutte le pagine hanno il corpo atteso"
