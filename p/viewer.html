<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galleria</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%0A%20%20%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2228%22%20fill%3D%22%230F0F0F%22%2F%3E%0A%20%20%3Ctext%20x%3D%2290%22%20y%3D%22118%22%20text-anchor%3D%22middle%22%20font-family%3D%22'Cormorant%20Garamond'%2C%20'Garamond'%2C%20'Times%20New%20Roman'%2C%20serif%22%20font-weight%3D%22400%22%20font-size%3D%22110%22%20fill%3D%22%23F5F1EA%22%20letter-spacing%3D%22-2%22%3ESL%3C%2Ftext%3E%0A%3C%2Fsvg%3E%0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../g/assets/app.css?v=9">
</head>
<body>
<header class="bar"><span id="btitle" aria-live="polite"></span><a class="brand" href="/">Simona Lascialfari</a><div class="lang" id="blang"><button type="button" data-lang="it" aria-label="Italiano">IT</button><span class="sep">|</span><button type="button" data-lang="en" aria-label="English">EN</button></div></header>
<main id="gate" hidden>
  <form id="pwform">
    <p class="hint" id="gatehint">Questa galleria è protetta. Inserisci la password che ti è stata comunicata.</p>
    <input id="pw" type="password" autocomplete="off" placeholder="Password" aria-label="Password" aria-describedby="gatehint err">
    <button type="submit" id="go">Entra</button>
    <p id="err" class="err" role="alert" hidden>Password errata</p>
  </form>
</main>

<div id="loading"><p class="hint" id="loadhint">Caricamento…</p></div>

<main id="offline" hidden>
  <p class="hint" id="offhint">Servizio temporaneamente non disponibile.<br>Riprova più tardi.</p>
</main>
<main id="invalid" hidden>
  <p class="hint" id="invhint">Questo link non è più valido.<br>La bozza potrebbe essere stata pubblicata, sostituita o revocata.</p>
</main>
<main id="gallery" hidden>
  <div id="grid"></div>
  <button id="more" hidden>Carica altre foto</button>
</main>
<div id="lb" hidden>
  <button id="close" aria-label="Chiudi">×</button>
  <button id="prev" aria-label="Precedente">‹</button>
  <img id="lbimg" alt="">
  <div id="lbcap"></div>
  <button id="next" aria-label="Successiva">›</button>
</div>
<script src="../g/assets/pviewer.js?v=8"></script>
</body>
</html>
