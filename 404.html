<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina non trovata — Simona Lascialfari</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%0A%20%20%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2228%22%20fill%3D%22%230F0F0F%22%2F%3E%0A%20%20%3Ctext%20x%3D%2290%22%20y%3D%22118%22%20text-anchor%3D%22middle%22%20font-family%3D%22'Cormorant%20Garamond'%2C%20'Garamond'%2C%20'Times%20New%20Roman'%2C%20serif%22%20font-weight%3D%22400%22%20font-size%3D%22110%22%20fill%3D%22%23F5F1EA%22%20letter-spacing%3D%22-2%22%3ESL%3C%2Ftext%3E%0A%3C%2Fsvg%3E%0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:hsl(45 30% 97%);--ink:hsl(0 0% 10%);--terra:hsl(12 37% 47%);--muted:hsl(0 0% 40%);--border:hsl(45 10% 85%)}
@media (prefers-color-scheme: dark){:root{--ivory:hsl(0 0% 10%);--ink:hsl(45 30% 97%);--border:hsl(0 0% 20%);--terra:hsl(12 45% 62%);--muted:hsl(0 0% 64%)}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--ivory);color:var(--ink)}
/* reset anchor: il brand visitato NON prende il viola/sottolineato di default
 * del browser (le regole d'autore battono sempre lo UA :visited) */
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--ivory)}
@media (min-width:768px){.bar{padding-left:3rem;padding-right:3rem}}
.brand{flex:1 1 0;text-align:center;font-family:Cormorant Garamond,Georgia,serif;font-size:1.125rem;line-height:1.75rem;letter-spacing:.25em;text-transform:uppercase;white-space:nowrap}
.nf{max-width:460px;margin:14vh auto 0;padding:0 1.4rem;text-align:center}
.nf h1{font-family:Cormorant Garamond,Georgia,serif;font-weight:500;font-size:4rem;margin:0;color:var(--terra);letter-spacing:.04em}
.nf .t{font-family:Cormorant Garamond,Georgia,serif;font-size:1.35rem;margin:.4rem 0 1rem}
.nf .m{font-size:.88rem;color:var(--muted);line-height:1.7;margin:0 0 2rem}
.dl{display:inline-block;color:var(--terra);text-decoration:none;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--terra);padding-bottom:2px}
</style>
<script>
(function () {
  // dirotta SOLO /p/<slug>/ (bozze) sul viewer dinamico — niente regex con
  // backslash: gli strati di escaping (TS template, JSON, CDN) li mangiano
  var p = location.pathname;
  var i = p.indexOf("/p/");
  if (i < 0) return;
  var rest = p.slice(i + 3);
  var slug = rest.endsWith("/") ? rest.slice(0, -1) : rest;
  if (!/^[a-z0-9-]+$/.test(slug)) return;
  var prefix = p.slice(0, i + 1); // include lo slash finale
  var t = new URLSearchParams(location.search).get("t") || "";
  location.replace(prefix + "p/viewer.html?slug=" + slug + (t ? "&t=" + t : ""));
})();
</script>
</head>
<body>
<header class="bar"><span></span><a class="brand" href="/">Simona Lascialfari</a><span></span></header>
<main class="nf">
  <h1>404</h1>
  <p class="t">Questa pagina non esiste, o il suo indirizzo è cambiato.</p>
  <p class="m">Se stavi aprendo una galleria condivisa, verifica di usare il link completo ricevuto da Simona.</p>
  <a id="home" class="dl" href="/">Torna all'inizio</a>
</main>
<script>
(function () {
  // radice del SITO, non della radice utente: sui project-pages il primo
  // segmento è il nome del sito (/simona-test/)
  var seg = (location.pathname.split("/")[1] || "").split("?")[0];
  var root = ["g", "p", "404.html", "index.html"].indexOf(seg) >= 0 ? "/" : "/" + seg + "/";
  document.getElementById("home").setAttribute("href", root);
  document.querySelector(".brand").setAttribute("href", root);
})();
</script>
</body></html>
