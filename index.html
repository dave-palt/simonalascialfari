<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <title>Simona Lascialfari — Fotografa a Bagno a Ripoli, Firenze</title>

    <!-- Token di verifica Search Console: sostituito da Vite col valore di
       VITE_GOOGLE_SITE_VERIFICATION (la CI lo passa; fallback = token del
       dominio demo). Nuovo dominio → nuova verifica → variabile repo. -->
  <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    <script>
      // Tema chiaro/scuro: segue le impostazioni del dispositivo (nessun toggle
      // manuale, come nell'admin). Inline e pre-paint per evitare il flash.
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
